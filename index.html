<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Login</title>
</head>

<body>

    <form id="formUser" action="">

        <div class="content">
            <input id="nome" type="text" placeholder="Digite seu nome">
            <input id="email" type="email" placeholder="Digite seu E-mail">
        </div>

        <button type="button" id="btn" onclick="criarUsuario()">Adicionar</button>

        <div id="listarUsuarios">
        </div>
    </form>

</body>
<script>

    async function criarUsuario() {

        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;

        await fetch("http://localhost:3000/usuarios", {

            method: "POST",

            headers: { "Content-Type": "application/json" },

            body: JSON.stringify({
                name: nome,
                email: email
            })
        })

        listarUsuarios();

        document.getElementById("formUser").reset();
    }

    async function listarUsuarios() {

        const response = await fetch("http://localhost:3000/usuarios");
        const users = await response.json();

        const lista = document.getElementById("listarUsuarios");

        lista.innerHTML = "";

        users.forEach(user => {

            const card = document.createElement("div");
            card.classList.add("card");

            const divText = document.createElement("div");
            divText.classList.add("text-div");

            const nome = document.createElement("p");
            nome.textContent = `Nome: ${user.name}`;

            const email = document.createElement("p");
            email.textContent = `E-mail: ${user.email}`;

            const img = document.createElement("img");
            img.classList.add("img-foto");
            img.src = user.image;

            const btn = document.createElement("button");
            btn.classList.add("deleteUsuario");
            btn.onclick = () => deleteUsuario(user.id);

            const imgBtn = document.createElement("img");
            imgBtn.classList.add("img-remove");
            imgBtn.src = "./img/remover.png";

            card.appendChild(img);
            divText.appendChild(nome);
            divText.appendChild(email);

            card.appendChild(divText);
            card.appendChild(btn);

            btn.appendChild(imgBtn);

            lista.appendChild(card);
        });
    }
    listarUsuarios();

    async function deleteUsuario(id) {

        const confirmar = confirm("Tem ceerteza que deseja romover?");

        if (!confirmar) return;

        await fetch(`http://localhost:3000/usuarios/${id}`, {
            method: "DELETE"
        });

        listarUsuarios();
    }

</script>
</html>
